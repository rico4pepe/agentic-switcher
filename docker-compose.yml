services:
  postgres:
    image: postgres:16
    container_name: agentic-switcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_switcher
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: